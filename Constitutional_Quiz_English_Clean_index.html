let game=[],pos=0,score=0,locked=false;

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function begin(){
  let v=document.getElementById("count").value;
  let n=v==="all"?BANK.length:Math.min(+v,BANK.length);
  game=shuffle(BANK).slice(0,n).map(x=>({
    q:x.q,
    o:shuffle(x.o.map((t,i)=>({t,ok:String.fromCharCode(97+i)===x.a})))
  }));
  pos=0; score=0;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  render();
}

function render(){
  locked=false;
  let x=game[pos];
  document.getElementById("qn").textContent=`Question ${pos+1} / ${game.length}`;
  document.getElementById("score").textContent=`Score: ${score}`;
  document.getElementById("bar").style.width=(pos/game.length*100)+"%";
  document.getElementById("question").textContent=x.q;
  document.getElementById("feedback").textContent="";
  let box=document.getElementById("options");
  box.innerHTML="";
  x.o.forEach((z,k)=>{
    let b=document.createElement("button");
    b.className="option";
    b.textContent=String.fromCharCode(65+k)+". "+z.t;
    b.onclick=()=>answer(k);
    box.appendChild(b);
  });
  document.getElementById("next").classList.add("hidden");
}

function answer(k){
  if(locked)return;
  locked=true;
  let x=game[pos],bs=[...document.querySelectorAll(".option")];
  bs.forEach((b,i)=>{if(x.o[i].ok)b.classList.add("correct")});
  if(x.o[k].ok){
    score++;
    document.getElementById("feedback").textContent="✓ Correct!";
  }else{
    bs[k].classList.add("wrong");
    document.getElementById("feedback").textContent="✗ Incorrect";
  }
  document.getElementById("score").textContent=`Score: ${score}`;
  let next=document.getElementById("next");
  next.textContent=pos===game.length-1?"Finish":"Next";
  next.classList.remove("hidden");
}

document.getElementById("start").onclick=begin;
document.getElementById("next").onclick=()=>{
  if(pos<game.length-1){pos++;render();}
  else{
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");
    document.getElementById("final").textContent=`Score: ${score} / ${game.length}`;
    document.getElementById("stats").textContent=`Answered: ${game.length} | Correct: ${score}`;
  }
};
document.getElementById("again").onclick=()=>{
  document.getElementById("result").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
};
</script>
